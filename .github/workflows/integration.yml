name: Integration
on: [push]

jobs:
  integration:
    strategy:
      matrix:
        include:
          - PHP_VERSION: php83-fpm
            MAGENTO_VERSION: 2.4.7-p6
            MYSQL_IMAGE: mysql:5.7
          - PHP_VERSION: php83-fpm
            MAGENTO_VERSION: 2.4.8-p1
            MYSQL_IMAGE: mysql:5.7
          - PHP_VERSION: php85-fpm
            MAGENTO_VERSION: 2.4.9
            MYSQL_IMAGE: mysql:8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        name: Setup Magento community edition
        id: setup
        with:
          php-version: ${{ matrix.PHP_VERSION }}
          magento-version: ${{ matrix.MAGENTO_VERSION }}
          mysql-image: ${{ matrix.MYSQL_IMAGE }}

      - name: Run tests
        run: docker exec ${{ steps.setup.outputs.docker-container-name }} bash -c "cd /data/dev/tests/integration/ && ../../../vendor/bin/phpunit"

